name: 'Terraform Output as JSON'
description: 'Terraform output using JSON'

inputs:
  working-dir:
    description: 'Working directory for Terraform'
    required: false
    default: './terraform'

outputs:
  terraform-output:
    description: 'Terraform output'
    value: ${{ steps.terraform-output-action.outputs.terraform-output }}

runs:
  using: 'composite'
  steps:
    - name: Terraform Output
      id: terraform-output-action
      shell: bash
      run: |

        if [ ! -f ".terraform/terraform.tfstate" ]; then
          echo "Warning: Terraform doesn't appear to be initialized in this directory" >&2
        fi

        if output=$(terraform output -json); then
          
          if echo "$output" | jq empty 2>/dev/null; then
            {
              echo "terraform-output<<EOF"
              echo "$output"
              echo "EOF"
            } >> $GITHUB_OUTPUT
            
            # Print only the output names: values can be sensitive.
            echo "Terraform output names:"
            echo "$output" | jq -r 'keys[]'
          else
            echo "Error: Terraform output is not valid JSON (not printed: it may contain sensitive values)" >&2
            exit 1
          fi
        else
          echo "Error: terraform output command failed" >&2
          exit 1
        fi
      working-directory: ${{ inputs.working-dir }}